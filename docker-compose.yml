services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [database]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the HTTPS web domain}
      MOBILE_ORIGIN: https://localhost
      API_TRUST_PROXY_HOPS: 1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [frontend, database]
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL to the HTTPS API URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PUBLIC_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env.production}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [frontend]

  db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup.sh", "healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 15m
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  seed:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    command: ["npm", "--workspace", "apps/api", "run", "seed"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
      OWNER_NAME: ${OWNER_NAME:-Factory Owner}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL for initial seeding}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD for initial seeding}
      CONFIRM_INITIAL_BALANCES: ${CONFIRM_INITIAL_BALANCES:-false}
      SEASON_NAME: ${SEASON_NAME:-2026–27}
      SEASON_START_DATE: ${SEASON_START_DATE:-2026-10-01}
      OPENING_L30: ${OPENING_L30:-0}
      OPENING_M30: ${OPENING_M30:-0}
      OPENING_S1_30: ${OPENING_S1_30:-0}
      OPENING_S2_30: ${OPENING_S2_30:-0}
      CUMULATIVE_L30: ${CUMULATIVE_L30:-0}
      CUMULATIVE_M30: ${CUMULATIVE_M30:-0}
      CUMULATIVE_S1_30: ${CUMULATIVE_S1_30:-0}
      CUMULATIVE_S2_30: ${CUMULATIVE_S2_30:-0}
    depends_on:
      api:
        condition: service_healthy
    networks: [database]

volumes:
  postgres_data:

networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
